<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unity Asset Library</title>
<style>
  :root {
    color-scheme: light dark;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f6;
    --border: #dde2ea; --border-strong: #c5cdd9;
    --text: #18202e; --text-2: #4b5567; --text-3: #6b7486;
    --accent: #2f5496; --accent-soft: #e6edf8; --accent-soft-text: #24426f;
    --focus: rgba(47, 84, 150, 0.35);
    --danger: #c0392b; --danger-bg: #fdecea;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16191f; --surface: #1f232b; --surface-2: #272c35;
      --border: #323844; --border-strong: #434a58;
      --text: #e8ebf0; --text-2: #b4bbc8; --text-3: #8b93a3;
      --accent: #6f9be8; --accent-soft: #24304a; --accent-soft-text: #b9cdf3;
      --focus: rgba(111, 155, 232, 0.45);
      --danger: #ef7b6d; --danger-bg: #3a2220;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; padding: 32px 16px 64px; font: 14px/1.45 var(--font); color: var(--text); background: var(--bg); }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  #meta { font-size: 13px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  header { margin-bottom: 20px; }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input, select {
    min-height: 38px; padding: 8px 12px; font: 14px var(--font); color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
  }
  input { flex: 1; min-width: 220px; }
  input::placeholder { color: var(--text-3); }
  input:hover, select:hover { border-color: var(--text-3); }
  input:focus-visible, select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); overflow: clip; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; z-index: 1; background: var(--surface-2); color: var(--text-2);
    text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  tbody td { padding: 11px 14px; border-top: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  tbody tr:first-child td { border-top: none; }
  tbody tr:hover { background: var(--surface-2); }
  td.publisher, td.category { color: var(--text-2); }
  td.date { color: var(--text-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th.date { white-space: nowrap; }

  a.asset-link { color: var(--text); font-weight: 600; text-decoration: none; }
  a.asset-link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .purpose { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .tag {
    display: inline-block; margin: 1px 4px 2px 0; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; background: var(--accent-soft); color: var(--accent-soft-text);
  }
  .badge {
    display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; vertical-align: 1px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--danger-bg); color: var(--danger);
  }
  #empty { margin: 48px auto; text-align: center; color: var(--text-3); }

  /* Phones: each row becomes a card, with the column name before each value. */
  @media (max-width: 640px) {
    body { padding: 20px 12px 48px; }
    thead { display: none; }
    tbody tr { display: block; padding: 12px 14px; border-top: 1px solid var(--border); }
    tbody tr:first-child { border-top: none; }
    tbody td { display: flex; gap: 10px; padding: 2px 0; border: none; }
    tbody td.tags { display: block; }
    tbody td.tags::before { display: inline-block; width: 72px; margin-right: 10px; }
    select { flex: 1; }
    tbody td:empty { display: none; }
    tbody td:first-child { display: block; margin-bottom: 4px; }
    tbody td:not(:first-child)::before { content: attr(data-label); flex: 0 0 72px; color: var(--text-3); font-size: 12px; }
  }
  @media (prefers-reduced-motion: no-preference) { tbody tr { transition: background-color 0.12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Unity Asset Library</h1>
    <div id="meta" role="status">Loading…</div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search by name, publisher, category or tag" aria-label="Search assets">
    <select id="categoryFilter" aria-label="Filter by category">
      <option value="">All categories</option>
    </select>
  </div>

  <div class="table-wrap" id="table" hidden>
    <table>
      <thead>
        <tr>
          <th>Asset</th>
          <th>Publisher</th>
          <th>Category</th>
          <th>Tags</th>
          <th class="date">Date</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="empty" hidden>No assets logged yet.</div>
</div>

  <script>
    // This page reads library.json from the SAME directory it's served
    // from -- deploy it alongside that file (same GitHub repo, same
    // Netlify site) and this relative path just works.
    var DATA_URL = "./library.json";

    var library = [];
    var filterText = "";
    var filterCategory = "";

    function load() {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", DATA_URL, true);
      xhr.onload = function () {
        if (xhr.status < 200 || xhr.status >= 300) {
          document.getElementById("meta").textContent =
            "Could not load library.json -- HTTP " + xhr.status;
          return;
        }
        try {
          library = JSON.parse(xhr.responseText);
        } catch (e) {
          document.getElementById("meta").textContent =
            "Could not parse library.json -- " + e.message;
          return;
        }
        populateCategoryFilter();
        render();
      };
      xhr.onerror = function () {
        document.getElementById("meta").textContent = "Could not load library.json -- network error";
      };
      xhr.send();
    }

    function populateCategoryFilter() {
      var select = document.getElementById("categoryFilter");
      var seen = {};
      var categories = [];
      for (var i = 0; i < library.length; i++) {
        var cat = library[i].category;
        if (cat && !seen[cat]) {
          seen[cat] = true;
          categories.push(cat);
        }
      }
      categories.sort();
      for (var j = 0; j < categories.length; j++) {
        var opt = document.createElement("option");
        opt.value = categories[j];
        opt.textContent = categories[j];
        select.appendChild(opt);
      }
    }

    function matches(item) {
      if (filterCategory && item.category !== filterCategory) return false;
      if (!filterText) return true;
      var haystack = (item.asset + " " + item.publisher + " " + item.category + " " + item.tags).toLowerCase();
      return haystack.indexOf(filterText.toLowerCase()) !== -1;
    }

    function render() {
      var visible = library.filter(matches);
      document.getElementById("meta").textContent =
        visible.length + " of " + library.length + " assets";

      var tbody = document.getElementById("tbody");
      tbody.textContent = "";

      var table = document.getElementById("table");
      var empty = document.getElementById("empty");

      if (visible.length === 0) {
        table.hidden = true;
        empty.hidden = false;
        empty.textContent = library.length === 0
          ? "No assets logged yet."
          : "No matches for that search.";
        return;
      }
      table.hidden = false;
      empty.hidden = true;

      for (var i = 0; i < visible.length; i++) {
        var item = visible[i];
        var tr = document.createElement("tr");

        var assetTd = document.createElement("td");
        var link = document.createElement("a");
        link.className = "asset-link";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.asset;
        if (item.url) {
          link.href = item.url;
        } else {
          // No stored direct link (true for most of the seeded history) --
          // fall back to a Store search so every row stays clickable.
          link.href = "https://assetstore.unity.com/search?q=" + encodeURIComponent(item.asset);
          link.title = "No direct link saved -- searches the Asset Store for this name";
        }
        assetTd.appendChild(link);
        if (item.status === "Deprecated") {
          var badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = "Deprecated";
          assetTd.appendChild(badge);
        }
        if (item.purpose) {
          var purposeEl = document.createElement("span");
          purposeEl.className = "purpose";
          purposeEl.textContent = item.purpose;
          assetTd.appendChild(purposeEl);
        }

        var publisherTd = document.createElement("td");
        publisherTd.textContent = item.publisher;
        publisherTd.className = "publisher";
        publisherTd.setAttribute("data-label", "Publisher");

        var categoryTd = document.createElement("td");
        categoryTd.textContent = item.category;
        categoryTd.className = "category";
        categoryTd.setAttribute("data-label", "Category");

        var tagsTd = document.createElement("td");
        tagsTd.className = "tags";
        tagsTd.setAttribute("data-label", "Tags");
        var tagParts = (item.tags || "").split(",");
        for (var t = 0; t < tagParts.length; t++) {
          var tagText = tagParts[t].replace(/^\s+|\s+$/g, "");
          if (!tagText) continue;
          var span = document.createElement("span");
          span.className = "tag";
          span.textContent = tagText;
          tagsTd.appendChild(span);
        }

        var dateTd = document.createElement("td");
        dateTd.textContent = item.purchaseDate || "";
        dateTd.className = "date";
        dateTd.setAttribute("data-label", "Bought");

        tr.appendChild(assetTd);
        tr.appendChild(publisherTd);
        tr.appendChild(categoryTd);
        tr.appendChild(tagsTd);
        tr.appendChild(dateTd);
        tbody.appendChild(tr);
      }
    }

    document.getElementById("search").addEventListener("input", function (e) {
      filterText = e.target.value;
      render();
    });
    document.getElementById("categoryFilter").addEventListener("change", function (e) {
      filterCategory = e.target.value;
      render();
    });

    load();
  </script>
</body>
</html>
